<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Watch Later Sync</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Vlad · YouTube</p>
      <h1>Watch Later Sync</h1>
      <p class="lede">
        Scrapes your logged-in Watch Later playlist. The site never marks a video
        watched when you open it from the library.
      </p>

      <label>
        Library URL
        <input id="apiUrl" type="url" spellcheck="false" />
      </label>
      <label>
        Sync secret
        <input id="syncSecret" type="password" autocomplete="off" spellcheck="false" />
      </label>

      <button id="sync" type="button">Sync now</button>
      <p id="status" role="status"></p>
      <button id="doneCancel" type="button" class="link" hidden>Cancel marking</button>

      <section class="auto-sync" aria-labelledby="auto-sync-title">
        <h2 id="auto-sync-title">Automatic sync</h2>
        <label class="check">
          <input id="autoEnabled" type="checkbox" />
          <span>Auto-sync daily while the browser is open</span>
        </label>
        <label class="check">
          <input id="markDone" type="checkbox" />
          <span>Mark Done videos watched on YouTube (opens a small window, at most 5 per run)</span>
        </label>
        <p id="autoStatus" class="lede"></p>
      </section>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
