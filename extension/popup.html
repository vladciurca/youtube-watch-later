<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Watch Later Sync</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">Vlad · YouTube</p>
      <h1>Watch Later Sync</h1>
      <p class="lede">
        Scrapes your logged-in Watch Later playlist. The site never marks a video
        watched when you open it from the library.
      </p>

      <label>
        Library URL
        <input id="apiUrl" type="url" spellcheck="false" />
      </label>
      <label>
        Sync secret
        <input id="syncSecret" type="password" autocomplete="off" spellcheck="false" />
      </label>

      <button id="sync" type="button">Sync Watch Later</button>
      <p id="status" role="status"></p>

      <section class="done-sync" aria-labelledby="done-sync-title">
        <h2 id="done-sync-title">Sync Done to YouTube</h2>
        <p class="lede">
          Marks the videos you set to Done in the library as watched on YouTube.
          Manual only: it never runs on its own.
        </p>
        <button id="doneSync" type="button" class="secondary">Sync Done to YouTube</button>
        <div id="doneConfirm" class="confirm" hidden>
          <p id="doneConfirmText"></p>
          <div class="row">
            <button id="doneStart" type="button">Start</button>
            <button id="doneCancelConfirm" type="button" class="secondary">Not now</button>
          </div>
        </div>
        <div id="doneProgress" class="confirm" hidden>
          <p id="doneProgressText"></p>
          <button id="doneCancel" type="button" class="secondary">Cancel</button>
        </div>
        <button id="doneRetry" type="button" class="link" hidden>Retry skipped videos</button>
      </section>
    </main>
    <script src="popup.js" type="module"></script>
  </body>
</html>
